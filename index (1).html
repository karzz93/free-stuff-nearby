<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nearby – free water, toilets & parking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
:root{
  --bg:#F3F6F7; --surface:#FFFFFF; --ink:#13212B; --muted:#5B6B76; --line:#D9E1E5;
  --water:#1F8FE0; --wc:#6A4C93; --park:#1D4ED8; --wifi:#C27C0E; --aed:#0A8F4E;
  --focus:#F2B705; --sheet-shadow:0 -6px 24px rgba(19,33,43,.12);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A21; --surface:#17252E; --ink:#E7EEF1; --muted:#9AAAB4; --line:#2A3B46;
    --water:#4CB0FF; --wc:#A58AD6; --park:#6E93FF; --wifi:#F0A93A; --aed:#35C57E;
    --sheet-shadow:0 -6px 24px rgba(0,0,0,.45);
    color-scheme:dark;
  }
  :root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88)}
}
:root[data-theme="dark"]{
  --bg:#0F1A21; --surface:#17252E; --ink:#E7EEF1; --muted:#9AAAB4; --line:#2A3B46;
  --water:#4CB0FF; --wc:#A58AD6; --park:#6E93FF; --wifi:#F0A93A; --aed:#35C57E;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:380px 1fr}
#map{height:100%;width:100%;background:var(--bg)}
.panel{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:500}
.head{padding:20px 20px 12px}
.head h1{margin:0;font-size:1.75rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.head p{margin:6px 0 0;color:var(--muted);font-size:.95rem}

.signs{display:flex;gap:10px;padding:8px 20px 4px;overflow-x:auto;scrollbar-width:none}
.signs::-webkit-scrollbar{display:none}
.sign{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:4px 2px;cursor:pointer;width:62px}
.sign .disc{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--c);border:3px solid var(--c);transition:background .15s,color .15s}
.sign[aria-pressed="false"] .disc{background:transparent;color:var(--c)}
.sign span{font-size:.78rem;font-weight:600;color:var(--muted)}
.sign[aria-pressed="true"] span{color:var(--ink)}
.disc svg{width:26px;height:26px}
.glyph{font-weight:800;font-size:1.05rem;letter-spacing:-.03em}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 20px 14px;border-bottom:1px solid var(--line)}
.needs{flex-basis:100%;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:2px}
.needs::-webkit-scrollbar{display:none}
.need{flex:0 0 auto;border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:.82rem;color:var(--muted);cursor:pointer}
.need[aria-pressed="true"]{background:var(--aed);border-color:var(--aed);color:#fff;font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 11px;font-size:.85rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.check{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);cursor:pointer}
.check input{accent-color:var(--aed);width:16px;height:16px}

.status{padding:10px 20px;font-size:.9rem;color:var(--muted);min-height:1.2em}
.status.err{color:#C0392B}
.list{list-style:none;margin:0;padding:0 0 12px;overflow-y:auto;flex:1;min-height:0}
.item{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:10px 20px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.item:hover{background:color-mix(in srgb,var(--line) 45%,transparent)}
.item .mini{width:36px;height:36px;border-radius:9px;background:var(--c);color:#fff;display:grid;place-items:center}
.item .mini svg{width:20px;height:20px}
.item .mini .glyph{font-size:.85rem}
.item b{display:block;font-weight:600;font-size:.95rem}
.item small{color:var(--muted);font-size:.8rem}
.item .dist{font-weight:800;font-size:.95rem;font-variant-numeric:tabular-nums}
.empty{padding:24px 20px;color:var(--muted);font-size:.95rem}

.fab{position:absolute;z-index:600;border:0;border-radius:999px;background:var(--surface);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.18);cursor:pointer;font-weight:600}
.locate{right:14px;bottom:24px;width:48px;height:48px;display:grid;place-items:center}
.locate svg{width:22px;height:22px}
.again{left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));padding:10px 18px;display:none;background:var(--ink);color:var(--surface)}
.again.show{display:block}
.mapwrap{position:relative;min-height:0}
.locating{position:absolute;inset:0;z-index:700;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);color:var(--muted);font-weight:600}
.locating.show{display:flex}
.locating p{margin:0}
.pulse{width:18px;height:18px;border-radius:50%;background:#1F8FE0;border:3px solid #fff;box-shadow:0 0 0 0 rgba(31,143,224,.5);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{to{box-shadow:0 0 0 22px rgba(31,143,224,0)}}

/* map markers */
.pin{width:30px;height:30px;border-radius:9px;background:var(--c);color:#fff;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin svg{width:17px;height:17px}
.pin .glyph{font-size:.72rem}
.pin.hl{transform:scale(1.25);box-shadow:0 0 0 4px var(--focus)}
.me{width:18px;height:18px;border-radius:50%;background:#1F8FE0;border:3px solid #fff;box-shadow:0 0 0 6px rgba(31,143,224,.25)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink)}
.leaflet-popup-content{margin:14px 16px;font-family:inherit;font-size:.9rem;line-height:1.4}
.pop h3{margin:0 0 4px;font-size:1rem}
.pop ul{margin:6px 0 10px;padding-left:18px;color:var(--muted)}
.pop a.go{display:inline-block;background:var(--ink);color:var(--surface);text-decoration:none;padding:7px 12px;border-radius:8px;font-weight:600;margin-right:6px}
.pop a.alt{color:var(--muted);font-size:.85rem}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-control-attribution{font-size:10px}

/* reliability */
:root{--warn:#D98200;--bad:#D23B2E}
.pin{position:relative}
.pin .flag{position:absolute;top:-6px;right:-6px;width:13px;height:13px;border-radius:50%;border:2px solid #fff;background:var(--warn)}
.pin .flag.bad{background:var(--bad)}
.pin.dim{opacity:.55}
.trust{margin:6px 0 0;font-size:.82rem;font-weight:600;display:flex;gap:6px;align-items:center}
.trust::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.trust.ok::before{background:var(--aed)}
.trust.warn::before{background:var(--warn)}
.trust.bad::before{background:var(--bad)}
.note{margin:6px 0;padding:6px 8px;border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);font-size:.82rem}
.note a{color:inherit}
.rep{border-top:1px solid var(--line);margin-top:10px;padding-top:8px;font-size:.85rem}
.rep p{margin:0 0 6px}
.rep-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rep button{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 10px;font-size:.8rem;cursor:pointer;color:var(--ink)}
.rep button[aria-pressed="true"],.rep button.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.rep input{width:100%;margin:2px 0 6px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:.85rem}
.rep .flash{color:var(--muted);margin-top:6px}
.item small.t{display:flex;align-items:center;gap:5px}
.item small.t::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.item small.t.ok::before{background:var(--aed)}
.item small.t.warn::before{background:var(--warn)}
.item small.t.bad::before{background:var(--bad)}
.item.bad{opacity:.6}
.pin.hosted{background:var(--surface);color:var(--c);border:3px solid var(--c)}
.item small.hf{display:block;color:var(--c);font-weight:600}
.hidden-free{margin:6px 0 0;padding:6px 8px;border-left:3px solid var(--aed);background:color-mix(in srgb,var(--aed) 10%,transparent);font-size:.82rem}
.item small.h{display:block;font-weight:600}
.item small.h.open{color:var(--aed)}
.item small.h.closed{color:var(--bad)}
.item.shut .mini{opacity:.55}
.hours{margin:6px 0 0;font-size:.85rem;font-weight:700}
.hours.open{color:var(--aed)}
.hours.closed{color:var(--bad)}
.hours.unknown{color:var(--muted)}

/* mobile: map on top, sheet below */
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:52% 48%}
  .mapwrap{order:1}
  .panel{order:2;border-right:0;border-top:1px solid var(--line);box-shadow:var(--sheet-shadow);border-radius:16px 16px 0 0;margin-top:-14px}
  .head{padding:14px 16px 6px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .head h1{font-size:1.25rem}
  .head p{display:none}
  .signs{padding:4px 16px}
  .controls{padding:8px 16px 10px}
  .status{padding:8px 16px}
  .item{padding:9px 16px}
  .locate{bottom:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="panel" aria-label="Free utilities near you">
    <div class="head">
      <h1>Free stuff nearby</h1>
      <p>Drinking water, toilets, parking and more, from OpenStreetMap.</p>
    </div>
    <div class="signs" id="signs" role="group" aria-label="What to show"></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Search radius" id="radius"></div>
      <label class="check"><input type="checkbox" id="openNow"> Open now</label>
      <label class="check"><input type="checkbox" id="strict"> Only confirmed free</label>
      <div class="needs" id="needs" role="group" aria-label="Access needs"></div>
    </div>
    <div class="status" id="status" role="status" aria-live="polite">Finding your location…</div>
    <ul class="list" id="list"></ul>
  </aside>
  <div class="mapwrap">
    <div id="map" aria-label="Map"></div>
    <div class="locating show" id="locating" aria-hidden="true"><div class="pulse"></div><p>Finding your location…</p></div>
    <button class="fab again" id="again">Search this area</button>
    <button class="fab locate" id="locate" aria-label="Go to my location">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<script>
(function(){
const ICON = {
  drop:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c-3.2 4.6-6.5 8-6.5 11.6a6.5 6.5 0 0 0 13 0C18.5 10.5 15.2 7.1 12 2.5z"/></svg>',
  wifi:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2.5 9a14 14 0 0 1 19 0M5.8 12.6a9 9 0 0 1 12.4 0M9.1 16.1a4 4 0 0 1 5.8 0"/><circle cx="12" cy="19.4" r="1.3" fill="currentColor" stroke="none"/></svg>',
  aed:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 21s-7.2-4.6-9.6-9.2A5.3 5.3 0 0 1 12 6.3a5.3 5.3 0 0 1 9.6 5.5C19.2 16.4 12 21 12 21z"/><path fill="var(--c)" d="M13 8.5l-4 5.2h2.6l-1 3.8 4-5.2H12z"/></svg>'
};
// --- Hidden free options: toilets and water refills inside other places, no purchase needed
const PUBLIC_HOSTS={library:'library',townhall:'town hall',community_centre:'community centre',
  social_centre:'community centre',arts_centre:'arts centre',place_of_worship:'church'};
function isHosted(t){ return !['toilets','drinking_water','water_point'].includes(t.amenity) && t.man_made!=='water_tap'; }
function hiddenToilet(t){
  if(t.toilets!=='yes' || !isHosted(t)) return false;
  const acc=(t['toilets:access']||'').toLowerCase();
  if(['customers','private','no','permit'].includes(acc)) return false;
  if(['yes','permissive','public'].includes(acc)) return true;
  // No access tag: only count places that are public by nature
  return !!PUBLIC_HOSTS[t.amenity] || t.shop==='mall' || t.railway==='station' || t.public_transport==='station' || t.tourism==='museum';
}
function hiddenRefill(t){ return t['drinking_water:refill']==='yes' && isHosted(t); }
function hostName(t){
  if(PUBLIC_HOSTS[t.amenity]) return PUBLIC_HOSTS[t.amenity];
  if(t.railway==='station'||t.public_transport==='station') return 'station';
  if(t.shop==='mall') return 'shopping centre';
  if(t.tourism==='museum') return 'museum';
  const a={cafe:'café',restaurant:'restaurant',fast_food:'restaurant',bar:'bar',pub:'pub',fuel:'petrol station',
    pharmacy:'pharmacy',bank:'bank',cinema:'cinema',theatre:'theatre',hospital:'hospital',university:'university'}[t.amenity];
  if(a) return a;
  if(t.tourism==='hotel') return 'hotel';
  if(t.shop==='supermarket') return 'supermarket';
  if(t.shop) return 'shop';
  return 'building';
}
function hostedInfo(x){
  if(!isHosted(x.t)) return null;
  const h=hostName(x.t), an=/^[aeiou]/.test(h)?'an':'a';
  if(x.cat.id==='wc') return {short:`Inside ${an} ${h}`, long:`Toilet inside ${an} ${h} – free to use, no purchase needed. Open when the ${h} is open.`};
  if(x.cat.id==='water') return {short:`Free refill at ${an} ${h}`, long:`Free tap-water refill at this ${h} – just ask the staff.`};
  return null;
}
const CATS = [
  {id:'water', label:'Water', color:'--water', icon:ICON.drop, on:true,
   q:['nwr["amenity"="drinking_water"]','nwr["amenity"="water_point"]','nwr["man_made"="water_tap"]["drinking_water"="yes"]'],
   name:'Drinking water', match:t=>t.amenity==='drinking_water'||t.amenity==='water_point'||t.man_made==='water_tap'||hiddenRefill(t)},
  {id:'wc', label:'Toilets', color:'--wc', glyph:'WC', on:true,
   q:['nwr["amenity"="toilets"]'], name:'Public toilet', match:t=>t.amenity==='toilets'||hiddenToilet(t), feeMatters:true},
  {id:'park', label:'Parking', color:'--park', glyph:'P', on:true,
   q:['nwr["amenity"="parking"]'], name:'Parking', match:t=>t.amenity==='parking', feeMatters:true},
  {id:'wifi', label:'Wi‑Fi', color:'--wifi', icon:ICON.wifi, on:false,
   q:['nwr["internet_access"~"wlan|yes|wifi"]["internet_access:fee"~"no|customers"]'],
   name:'Free Wi‑Fi', match:t=>/wlan|yes|wifi/.test(t.internet_access||''), feeKey:'internet_access:fee'},
  {id:'aed', label:'Defibrillator', color:'--aed', icon:ICON.aed, on:false,
   q:['nwr["emergency"="defibrillator"]'], name:'Defibrillator (AED)', match:t=>t.emergency==='defibrillator'}
];
const RADII = [500,1000,2000,5000];
// Place data: public Overpass servers for now. Before a big launch, put your own server or data file first in this list.
const MIRRORS = ['https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
const state = {radius:1000, strict:false, center:null, me:null, results:[], markers:new Map(), req:0,
  reports:{}, notes:[], pending:null, flash:{}};

// --- Reliability reports (kept on this device; problems can be posted as public OSM notes)
const STATUS = {
  ok:      {label:'Worked',          past:'it worked',        note:'Confirmed working'},
  broken:  {label:'Broken',          past:'broken',           note:'Reported broken / not working'},
  locked:  {label:'Locked or closed',past:'locked or closed', note:'Reported locked or closed'},
  notfree: {label:'Not free',        past:'not free',         note:'Reported as not free (charges a fee)'}
};
const REPORTS_KEY='free-stuff-nearby-reports-v1';
try{ state.reports=JSON.parse(localStorage.getItem(REPORTS_KEY))||{}; }catch(e){ state.reports={}; }
function saveReports(){ try{ localStorage.setItem(REPORTS_KEY,JSON.stringify(state.reports)); }catch(e){} }

const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const face = c => c.icon || `<span class="glyph">${c.glyph}</span>`;

// --- UI: category signs
CATS.forEach(c=>{
  const b=document.createElement('button');
  b.className='sign'; b.style.setProperty('--c',`var(${c.color})`);
  b.setAttribute('aria-pressed',c.on);
  b.innerHTML=`<div class="disc">${face(c)}</div><span>${c.label}</span>`;
  b.onclick=()=>{c.on=!c.on;b.setAttribute('aria-pressed',c.on);render();};
  $('signs').appendChild(b);
});
RADII.forEach(r=>{
  const b=document.createElement('button');
  b.textContent=r<1000?`${r} m`:`${r/1000} km`;
  b.setAttribute('aria-pressed',r===state.radius);
  b.onclick=()=>{state.radius=r;[...$('radius').children].forEach(x=>x.setAttribute('aria-pressed',x===b));const f=state.fetched;if(f&&r<=f.r&&state.center===f.center){if(ring)ring.setRadius(r);render();}else search();};
  $('radius').appendChild(b);
});
$('strict').onchange=e=>{state.strict=e.target.checked;render();};
$('openNow').onchange=e=>{state.openNow=e.target.checked;render();};

// --- Access needs: each one narrows down only the kind of place it applies to
const yes=v=>v==='yes'||v==='designated';
const NEEDS=[
  {id:'wheelchair', label:'Wheelchair accessible', cats:['wc','water','park','aed','wifi'],
   has:x=>yes(x.t.wheelchair)||yes(x.t['toilets:wheelchair'])||(x.cat.id==='park'&&(+x.t['capacity:disabled']>0||x.t['capacity:disabled']==='yes'))},
  {id:'baby', label:'Baby changing', cats:['wc'], has:x=>yes(x.t.changing_table)||yes(x.t['toilets:changing_table'])},
  {id:'neutral', label:'Gender-neutral', cats:['wc'], has:x=>x.t.unisex==='yes'||x.t['toilets:unisex']==='yes'||x.t.gender_segregated==='no'},
  {id:'bottle', label:'Bottle refill', cats:['water'], has:x=>x.t.bottle==='yes'},
  {id:'dog', label:'Dog bowl', cats:['water'], has:x=>x.t.dog==='yes'||yes(x.t['drinking_water:dog'])}
];
const NEEDS_KEY='free-stuff-nearby-needs-v1';
state.needs=new Set();
try{ (JSON.parse(localStorage.getItem(NEEDS_KEY))||[]).forEach(n=>state.needs.add(n)); }catch(e){}
NEEDS.forEach(n=>{
  const b=document.createElement('button');
  b.className='need'; b.textContent=n.label;
  b.setAttribute('aria-pressed',state.needs.has(n.id));
  b.onclick=()=>{
    state.needs.has(n.id)?state.needs.delete(n.id):state.needs.add(n.id);
    b.setAttribute('aria-pressed',state.needs.has(n.id));
    try{ localStorage.setItem(NEEDS_KEY,JSON.stringify([...state.needs])); }catch(e){}
    render();
  };
  $('needs').appendChild(b);
});
function meetsNeeds(x){
  for(const n of NEEDS){
    if(state.needs.has(n.id) && n.cats.includes(x.cat.id) && !n.has(x)) return false;
  }
  return true;
}

// --- Map
let startAt=[52.2,5.3], startZoom=7, hasStoredCenter=false;
try{const l=JSON.parse(localStorage.getItem('free-stuff-nearby-last-center'));if(Array.isArray(l)){startAt=l;startZoom=15;hasStoredCenter=true;}}catch(e){}
const map=L.map('map',{zoomControl:false}).setView(startAt,startZoom);
L.control.zoom({position:'topright'}).addTo(map);
// Base map: OpenFreeMap (free, no key, no usage limits, commercial use allowed).
// Falls back to the OSM volunteer tiles only if this phone can't draw vector maps.
const MAP_STYLE='https://tiles.openfreemap.org/styles/positron';
const MAP_CREDIT='<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> © <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>';
let usedVector=false;
try{
  if(window.maplibregl && L.maplibreGL && maplibregl.supported?.({failIfMajorPerformanceCaveat:false})!==false){
    L.maplibreGL({style:MAP_STYLE,attribution:MAP_CREDIT}).addTo(map); usedVector=true;
  }
}catch(e){}
if(!usedVector) L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,keepBuffer:4,updateWhenZooming:false,attribution:'© OpenStreetMap contributors'}).addTo(map);
const layer=L.layerGroup().addTo(map);
let meMarker=null, ring=null;

map.on('moveend',()=>{
  if(!state.center) return;
  const d=map.distance(map.getCenter(),state.center);
  $('again').classList.toggle('show', d>state.radius*0.4);
});
$('again').onclick=()=>{state.center=map.getCenter();$('again').classList.remove('show');search();};
$('locate').onclick=()=>locate(true);

function setStatus(t,err){const s=$('status');s.textContent=t;s.classList.toggle('err',!!err);}

// --- Location: answer fast with a rough fix, then sharpen it quietly
const LAST_KEY='free-stuff-nearby-last-center';
function rememberCenter(ll){ try{ localStorage.setItem(LAST_KEY,JSON.stringify([ll.lat,ll.lng])); }catch(e){} }
function showMe(ll){
  if(meMarker) meMarker.setLatLng(ll);
  else meMarker=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18]}),interactive:false,zIndexOffset:1000}).addTo(map);
}
let watchId=null, hasFix=false, giveUpTimer=null;
function hideLocating(){ $('locating').classList.remove('show'); }
function firstFix(ll){
  hasFix=true; clearTimeout(giveUpTimer); hideLocating();
  state.me=ll; showMe(ll); rememberCenter(ll);
  state.center=ll; map.setView(ll,16,{animate:false}); search();
}
function noLocation(msg){
  clearTimeout(giveUpTimer); hideLocating();
  if(hasFix || state.center) return;
  // No location: show the last place you used, or the whole covered area
  getManifest().then(m=>{
    if(!hasStoredCenter && m && m.bbox){ const [s,w,n,e]=m.bbox; map.fitBounds([[s,w],[n,e]],{animate:false}); }
    fallback(msg);
  });
}
function locate(userAsked){
  if(!navigator.geolocation){ noLocation('Location isn’t available in this browser. Move the map and tap “Search this area”.'); return; }
  setStatus('Finding your location…');
  const ll=p=>L.latLng(p.coords.latitude,p.coords.longitude);
  if(userAsked && hasFix){
    // Tapping the location button: jump straight to the latest known position
    if(state.me){ state.center=state.me; map.setView(state.me,16); search(); }
  }
  // 1) Quick: accept a recent or network-based fix (usually under a second)
  navigator.geolocation.getCurrentPosition(p=>{
    if(!hasFix) firstFix(ll(p));
    else if(userAsked){ state.me=ll(p); showMe(state.me); state.center=state.me; map.setView(state.me,16); search(); }
  },err=>{
    if(err.code===1) noLocation('Location is turned off for this site. Allow it in your browser settings, or move the map and tap “Search this area”.');
  },{enableHighAccuracy:false,maximumAge:10*60000,timeout:8000});
  // 2) Precise: GPS refines the blue dot; only re-searches if you’ve really moved
  if(watchId==null) watchId=navigator.geolocation.watchPosition(p=>{
    const here=ll(p);
    if(!hasFix){ firstFix(here); return; }
    state.me=here; showMe(here);
    if(state.center && map.distance(here,state.center)>state.radius*0.25){ state.center=here; rememberCenter(here); search(); }
  },err=>{ if(err.code===1) noLocation('Location is turned off for this site. Allow it in your browser settings, or move the map and tap “Search this area”.'); },
  {enableHighAccuracy:true,maximumAge:30000,timeout:20000});
  // Give up waiting after 12 seconds, but keep listening in case GPS finds you later
  if(!hasFix){ clearTimeout(giveUpTimer); giveUpTimer=setTimeout(()=>noLocation('Still looking for your location. Move the map and tap “Search this area” in the meantime.'),12000); }
}
function fallback(msg){
  state.center=map.getCenter(); setStatus(msg,true);
  $('again').classList.add('show');
}

// --- Data: one fast query for every category, cached, raced across servers
const CACHE_KEY='free-stuff-nearby-cache-v1', CACHE_MAX=6, CACHE_FRESH=6*3600e3;
function readCache(){ try{ return JSON.parse(localStorage.getItem(CACHE_KEY))||[]; }catch(e){ return []; } }
function findCache(ll,r){
  return readCache().find(c=>c.r>=r && map.distance(ll,[c.lat,c.lng])<=c.r-r+Math.min(150,r*0.2));
}
function writeCache(ll,r,elements){
  try{
    const slim=elements.map(e=>({type:e.type,id:e.id,lat:e.lat,lon:e.lon,center:e.center,tags:e.tags,timestamp:e.timestamp}));
    const list=[{lat:ll.lat,lng:ll.lng,r,at:Date.now(),elements:slim},...readCache()].slice(0,CACHE_MAX);
    localStorage.setItem(CACHE_KEY,JSON.stringify(list));
  }catch(e){ try{ localStorage.removeItem(CACHE_KEY); }catch(_){} }
}
// Ask one server at a time: the main server allows only 2 running searches per person,
// and a search keeps its slot even if we stop waiting for it.
async function fetchOverpass(query,id){
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  for(let pass=0;pass<2;pass++){
    for(let i=0;i<MIRRORS.length;i++){
      if(id!==state.req) return null;
      const ctrl=new AbortController(), timer=setTimeout(()=>ctrl.abort(),30000);
      try{
        const r=await fetch(MIRRORS[i],{method:'POST',body:'data='+encodeURIComponent(query),
          headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ctrl.signal});
        if(r.ok){
          const j=await r.json();
          if(j && Array.isArray(j.elements) && !/runtime error/i.test(j.remark||'')) return j;
        }
      }catch(e){}
      finally{ clearTimeout(timer); }
      if(id===state.req) setStatus('Data server is busy – trying another one…');
    }
    await sleep(3000);
  }
  return null;
}
function useElements(elements,center){
  const seen=new Set();
  state.results=elements.map(el=>{
    const t=el.tags||{}, la=el.lat??el.center?.lat, lo=el.lon??el.center?.lon;
    const cat=CATS.find(c=>c.match(t));
    if(!cat||la==null) return null;
    const key=el.type+'/'+el.id; if(seen.has(key)) return null; seen.add(key);
    return {key,el,t,cat,ts:el.timestamp,notes:[],ll:L.latLng(la,lo),d:map.distance(center,[la,lo])};
  }).filter(Boolean);
}

// --- Prepared data files (built weekly by the GitHub automation), used before any server
const DATA_BASE='data/';
let manifest; // undefined = not checked yet, null = no files available
async function getManifest(){
  if(manifest!==undefined) return manifest;
  try{ const r=await fetch(DATA_BASE+'manifest.json',{cache:'no-cache'}); manifest=r.ok?await r.json():null; }
  catch(e){ manifest=null; }
  return manifest;
}
const cellCache=new Map();
function loadCell(cid){
  if(!cellCache.has(cid)) cellCache.set(cid, fetch(DATA_BASE+'cells/'+cid+'.json').then(r=>r.ok?r.json():[]).catch(()=>{ cellCache.delete(cid); return null; }));
  return cellCache.get(cid);
}
async function loadFromFiles(center,r){
  const m=await getManifest();
  if(!m || !m.bbox || !m.cells) return null;
  const [bs,bw,bn,be]=m.bbox;
  if(center.lat<bs||center.lat>bn||center.lng<bw||center.lng>be) return null; // outside covered countries
  const dLat=r/111320, dLng=r/(111320*Math.cos(center.lat*Math.PI/180)), c=m.cell;
  const have=new Set(m.cells), ids=[];
  for(let y=Math.floor((center.lat-dLat)/c); y<=Math.floor((center.lat+dLat)/c); y++)
    for(let x=Math.floor((center.lng-dLng)/c); x<=Math.floor((center.lng+dLng)/c); x++)
      if(have.has(`${y}_${x}`)) ids.push(`${y}_${x}`);
  if(!ids.length) return null; // nothing prepared here, ask a server instead
  const parts=await Promise.all(ids.map(loadCell));
  if(parts.some(p=>p===null)) return null;
  const T={n:'node',w:'way',r:'relation'};
  const elements=parts.flat().map(row=>({type:T[row[0]],id:row[1],lat:row[2],lon:row[3],timestamp:row[4],tags:row[5]}));
  return {elements,built:m.built};
}

async function search(){
  if(!state.center) return;
  const center=state.center, r=state.radius, id=++state.req;
  if(ring) ring.remove();
  ring=L.circle(center,{radius:r,color:css('--muted'),weight:1,fill:false,dashArray:'4 6',interactive:false}).addTo(map);

  // Fastest: the prepared data files that ship with the app
  const files=await loadFromFiles(center,r);
  if(id!==state.req) return;
  if(files){
    state.dataBuilt=files.built; state.fetched={center,r};
    useElements(files.elements,center); render(); loadNotes(id);
    return;
  }
  state.dataBuilt=null;

  // Show saved results for this area instantly, then refresh if they’re old
  const cached=findCache(center,r);
  if(cached){
    useElements(cached.elements,center); render(); loadNotes(id);
    if(Date.now()-cached.at<CACHE_FRESH){ state.fetched={center,r}; return; }
    setStatus($('status').textContent+' – updating…');
  } else setStatus('Searching OpenStreetMap…');

  // A bounding box is much faster for the servers than “around” searches
  const dLat=r/111320, dLng=r/(111320*Math.cos(center.lat*Math.PI/180));
  const bb=[center.lat-dLat,center.lng-dLng,center.lat+dLat,center.lng+dLng].map(v=>v.toFixed(5)).join(',');
  const query=`[out:json][timeout:25][bbox:${bb}];(
    nwr["amenity"~"^(drinking_water|water_point|toilets|parking)$"];
    nwr["man_made"="water_tap"]["drinking_water"="yes"];
    nwr["emergency"="defibrillator"];
    nwr["toilets"="yes"]["toilets:access"~"^(yes|permissive|public)$"];
    nwr["toilets"="yes"]["amenity"~"^(library|townhall|community_centre|social_centre|arts_centre|place_of_worship)$"];
    nwr["toilets"="yes"]["shop"="mall"];
    nwr["toilets"="yes"]["railway"="station"];
    nwr["toilets"="yes"]["public_transport"="station"];
    nwr["toilets"="yes"]["tourism"="museum"];
    nwr["drinking_water:refill"="yes"];
    nwr["internet_access"~"wlan|yes|wifi"]["internet_access:fee"~"no|customers"];
  );out center meta qt 3000;`;
  let data=null;
  data=await fetchOverpass(query,id);
  if(id!==state.req) return;
  if(!data){
    if(!cached){ state.results=[]; render(); $('list').innerHTML=''; setStatus('The free map data servers are busy right now. Wait a minute, then tap “Search this area”.',true); }
    else setStatus('Showing saved results – couldn’t refresh right now.',true);
    $('again').classList.add('show');
    return;
  }
  writeCache(center,r,data.elements);
  state.fetched={center,r};
  useElements(data.elements,center);
  render();
  loadNotes(id);
}

// Open OpenStreetMap notes near each place = problem reports anyone can see
async function loadNotes(id){
  const {lat,lng}=state.center, r=state.radius+50;
  const dLat=r/111320, dLng=r/(111320*Math.cos(lat*Math.PI/180));
  const url=`https://api.openstreetmap.org/api/0.6/notes.json?bbox=${(lng-dLng).toFixed(5)},${(lat-dLat).toFixed(5)},${(lng+dLng).toFixed(5)},${(lat+dLat).toFixed(5)}&closed=0&limit=500`;
  try{
    const res=await fetch(url); if(!res.ok) return;
    const j=await res.json(); if(id!==state.req) return;
    state.notes=j.features.map(f=>{
      const c=(f.properties.comments||[])[0]||{};
      const raw=(f.properties.date_created||'').replace(' UTC','Z').replace(' ','T');
      return {id:f.properties.id, ll:L.latLng(f.geometry.coordinates[1],f.geometry.coordinates[0]), text:c.text||'', date:new Date(raw)};
    });
    state.results.forEach(x=>{ x.notes=state.notes.filter(n=>n.ll.distanceTo(x.ll)<=25 && !/^Confirmed working/.test(n.text)); });
    render();
  }catch(e){ /* notes are a bonus; the map still works without them */ }
}

async function postNote(x,status,comment){
  const name=x.t.name||x.cat.name;
  const text=`${STATUS[status].note}: ${name} (${x.cat.name})\nhttps://www.openstreetmap.org/${x.key}`+
    (comment?`\nDetails: ${comment}`:'')+`\n\nPosted with the Free stuff nearby app.`;
  const body=new URLSearchParams({lat:x.ll.lat.toFixed(6),lon:x.ll.lng.toFixed(6),text});
  const res=await fetch('https://api.openstreetmap.org/api/0.6/notes.json',{method:'POST',body});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const j=await res.json();
  return {id:j.properties?.id, ll:x.ll, text, date:new Date()};
}

function freeness(x){
  const t=x.t, hosted=isHosted(t)&&(x.cat.id==='wc'||x.cat.id==='water');
  const k=hosted?(x.cat.id==='wc'?'toilets:fee':'drinking_water:fee'):(x.cat.feeKey||'fee'), f=(t[k]||'').toLowerCase();
  if(['yes','paid'].includes(f) || /\d/.test(f)) return 'paid';
  if(hosted){
    if(f==='no') return 'free';
    // Station and shopping-centre toilets often charge, so don't promise free without a tag
    if(x.cat.id==='wc' && (t.railway==='station'||t.public_transport==='station'||t.shop==='mall')) return 'unknown';
    return 'free'; // libraries, town halls, places marked open to all
  }
  if(['private','no','customers','permit'].includes((t.access||'').toLowerCase()) && x.cat.id!=='aed') return 'private';
  if(f==='no' || f==='donation') return 'free';
  if(x.cat.id==='wifi' && f==='customers') return 'customers';
  return (x.cat.feeMatters||x.cat.feeKey)?'unknown':'free';
}

function details(x){
  const t=x.t, out=[];
  const f=freeness(x);
  if(f==='free' && (x.cat.feeMatters||x.cat.feeKey)) out.push('Free');
  if(f==='unknown') out.push('Fee not listed – usually free, worth checking');
  if(f==='customers') out.push('Free for customers');
  if(t.opening_hours) out.push('Hours: '+t.opening_hours);
  if(yes(t.wheelchair)||yes(t['toilets:wheelchair'])) out.push('Wheelchair accessible');
  else if(t.wheelchair==='limited') out.push('Partly wheelchair accessible');
  else if(t.wheelchair==='no') out.push('Not wheelchair accessible');
  if(+t['capacity:disabled']>0) out.push(t['capacity:disabled']+' disabled parking '+(+t['capacity:disabled']===1?'space':'spaces'));
  else if(t['capacity:disabled']==='yes') out.push('Disabled parking spaces');
  if(t.unisex==='yes'||t.gender_segregated==='no') out.push('Gender-neutral');
  if(t.dog==='yes'||yes(t['drinking_water:dog'])) out.push('Dog bowl');
  if(yes(t.changing_table)) out.push('Baby changing');
  if(t.bottle==='yes') out.push('Bottle refill');
  if(t.drinking_water==='no') out.push('Not drinkable');
  if(t.capacity) out.push(t.capacity+' spaces');
  if(t.maxstay) out.push('Max stay: '+t.maxstay);
  if(t.parking) out.push(t.parking.replace(/_/g,' ')+' parking');
  if(t.indoor==='yes'||t['defibrillator:location']) out.push(t['defibrillator:location']||'Indoors');
  return out;
}

const fmt = d => d<1000?`${Math.round(d/10)*10} m`:`${(d/1000).toFixed(1)} km`;
const DAY=864e5;
function ago(t){
  const days=(Date.now()-t)/DAY;
  if(days<1) return 'today';
  const unit=(n,w)=>`${n} ${w}${n===1?'':'s'} ago`;
  if(days<31) return unit(Math.round(days),'day');
  if(days<365) return unit(Math.max(1,Math.round(days/30.4)),'month');
  return unit(Math.round(days/365),'year');
}
function lastChecked(x){
  let best=null;
  Object.keys(x.t).filter(k=>/^(check_date|survey:date|survey_date)(:|$)/.test(k)).forEach(k=>{
    const d=new Date(x.t[k]); if(!isNaN(d)&&(!best||d>best)) best=d;
  });
  if(best) return {d:best,src:'checked'};
  if(x.ts) return {d:new Date(x.ts),src:'edited'};
  return null;
}
// One line that answers “can I trust this?”, strongest evidence first
function trust(x){
  const mine=state.reports[x.key];
  const fresh=mine && (Date.now()-mine.at)<90*DAY;
  if(fresh && mine.status!=='ok') return {level:'bad',text:`You reported ${STATUS[mine.status].past} ${ago(mine.at)}`};
  if(x.notes.length) return {level:'warn',text:`Problem reported ${ago(x.notes[0].date)}`};
  if(fresh) return {level:'ok',text:`You confirmed it worked ${ago(mine.at)}`};
  const lc=lastChecked(x);
  if(lc){
    const old=(Date.now()-lc.d)>3*365*DAY;
    return {level:old?'neutral':'ok',text:`${lc.src==='checked'?'Last checked':'Map info updated'} ${ago(lc.d)}`};
  }
  return null;
}

function popupHtml(x){
  const c=x.cat, name=x.t.name||c.name, tr=x.trust, mine=state.reports[x.key];
  const dest=`${x.ll.lat},${x.ll.lng}`, det=details(x);
  let rep;
  if(state.pending===x.key){
    rep=`<p>Saved on this device. Post it as a public OpenStreetMap note too? Everyone using maps here will see the warning, and volunteers can fix the map.</p>
      <input type="text" maxlength="200" placeholder="Add a detail (optional), e.g. “tap has no water”" data-comment="${x.key}">
      <div class="rep-btns"><button class="primary" data-share="yes" data-key="${x.key}">Post public note</button><button data-share="no" data-key="${x.key}">Keep it private</button></div>`;
  } else {
    rep=`<p>Was it usable?</p><div class="rep-btns">`+
      Object.entries(STATUS).map(([k,s])=>`<button data-report="${k}" data-key="${x.key}" aria-pressed="${mine?.status===k}">${s.label}</button>`).join('')+`</div>`;
  }
  if(state.flash[x.key]) rep+=`<p class="flash">${esc(state.flash[x.key])}</p>`;
  const hi=hostedInfo(x);
  return `<div class="pop"><h3>${esc(name)}</h3><small>${esc(hi?hi.short:c.name)} · ${fmt(x.d)} away</small>`+
    (hi?`<p class="hidden-free">${esc(hi.long)}</p>`:'')+
    (x.hours?`<p class="hours ${x.hours.state}">${esc(x.hours.text)}</p>`:'')+
    (tr?`<p class="trust ${tr.level}">${esc(tr.text)}</p>`:'')+
    x.notes.slice(0,2).map(n=>`<p class="note">“${esc(n.text.split('\n')[0].slice(0,140))}” <a target="_blank" rel="noopener" href="https://www.openstreetmap.org/note/${n.id}">View note</a></p>`).join('')+
    (det.length?`<ul>${det.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:'<br>')+
    `<a class="go" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=walking">Get directions</a>`+
    `<a class="alt" target="_blank" rel="noopener" href="https://www.openstreetmap.org/${x.key}">Edit on OSM</a>`+
    `<div class="rep">${rep}</div></div>`;
}

function onReport(key,status){
  const cur=state.reports[key];
  delete state.flash[key];
  if(cur && cur.status===status){ delete state.reports[key]; state.pending=null; state.flash[key]='Report removed.'; }
  else {
    state.reports[key]={status,at:Date.now()};
    state.pending = status==='ok' ? null : key;
    if(status==='ok') state.flash[key]='Thanks – saved on this device.';
  }
  saveReports(); render(key);
}
async function onShare(key,yes,comment){
  const x=state.results.find(r=>r.key===key); if(!x) return;
  if(!yes){ state.pending=null; state.flash[key]='Saved on this device only.'; render(key); return; }
  state.pending=null; state.flash[key]='Posting note…'; render(key);
  try{
    const n=await postNote(x,state.reports[key].status,comment.trim());
    x.notes.unshift(n);
    state.flash[key]='Posted to OpenStreetMap. Thanks – others will see this warning.';
  }catch(e){
    state.flash[key]='Couldn’t post the note right now. Your report is still saved on this device.';
  }
  render(key);
}
map.on('popupopen',e=>{
  const el=e.popup.getElement(); if(!el) return;
  el.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>onReport(b.dataset.key,b.dataset.report));
  el.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>{
    const inp=el.querySelector('[data-comment]');
    onShare(b.dataset.key,b.dataset.share==='yes',inp?inp.value:'');
  });
});

// --- Opening hours: “open now”, using the opening_hours library (loaded in the background)
let OH=null;
function loadHoursLib(){
  const add=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});
  add('https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js')
    .then(()=>add('https://cdn.jsdelivr.net/npm/opening_hours@3.15.0/build/opening_hours.js'))
    .then(()=>{ OH=window.opening_hours||null; if(OH && state.results.length) render(); })
    .catch(()=>{ /* without the library, hours show as plain text */ });
}
// Public holidays depend on the country
const ISO={netherlands:'nl',belgium:'be',germany:'de','united-kingdom':'gb',france:'fr',luxembourg:'lu',spain:'es',italy:'it',austria:'at',switzerland:'ch',denmark:'dk'};
function countryFor(ll){
  const m=manifest; if(!m||!m.bbox||!m.areas||m.areas.length!==1) return null;
  const [s,w,n,e]=m.bbox; if(ll.lat<s||ll.lat>n||ll.lng<w||ll.lng>e) return null;
  return ISO[m.areas[0].split('/').pop()]||null;
}
const ohCache=new Map();
function hoursOf(x){
  const v=(x.cat.id==='wc'&&x.t['toilets:opening_hours'])||x.t.opening_hours; if(!v||!OH) return null;
  if(!ohCache.has(x.key)){
    const cc=countryFor(x.ll), nom={lat:String(x.ll.lat),lon:String(x.ll.lng)}; // strings: needed for real sunrise/sunset times
    if(cc) nom.address={country_code:cc,state:''};
    let oh=null;
    try{ oh=new OH(v,nom); }catch(e){ oh=null; }
    ohCache.set(x.key,oh);
  }
  const oh=ohCache.get(x.key); if(!oh) return null;
  const now=new Date();
  try{
    const unknown=oh.getUnknown(now), open=oh.getState(now), next=oh.getNextChange(now);
    if(unknown) return {state:'unknown',text:'Hours vary – check before you go'};
    if(open) return {state:'open',text:next?`Open – closes ${when(next)}`:'Open 24/7'};
    return {state:'closed',text:next?`Closed – opens ${when(next)}`:'Closed'};
  }catch(e){ return null; }
}
function when(d){
  const now=new Date(), day=t=>new Date(t.getFullYear(),t.getMonth(),t.getDate());
  const time=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  const days=Math.round((day(d)-day(now))/DAY);
  if(days===0) return time;
  if(days===1) return 'tomorrow '+time;
  if(days<7) return d.toLocaleDateString('en-GB',{weekday:'long'})+' '+time;
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}
// Keep “open now” current while the app stays open
setInterval(()=>{ if(OH && state.results.length && !document.querySelector('.leaflet-popup')) render(); },5*60000);

function render(openKey){
  layer.clearLayers(); state.markers.clear();
  const list=$('list'); list.innerHTML='';
  let closedHidden=0, needsHidden=0;
  const rows=state.results.filter(x=>{
    if(!x.cat.on || x.d>state.radius) return false;
    const f=freeness(x);
    if(f==='paid'||f==='private') return false;
    if(state.strict && (x.cat.feeMatters||x.cat.feeKey) && f!=='free') return false;
    x.hours=hoursOf(x);
    // Places without listed hours stay: most fountains and AEDs are always available
    if(state.openNow && x.hours && x.hours.state==='closed'){ closedHidden++; return false; }
    if(!meetsNeeds(x)){ needsHidden++; return false; }
    return true;
  });
  rows.forEach(x=>x.trust=trust(x));
  // Places you reported as unusable sink to the bottom
  rows.sort((a,b)=>((a.trust?.level==='bad')-(b.trust?.level==='bad'))||a.d-b.d);
  const shown=rows.slice(0,400);

  shown.forEach((x,i)=>{
    const c=x.cat, colorVar=`var(${c.color})`, lvl=x.trust?.level;
    const flag=lvl==='bad'?'<i class="flag bad"></i>':lvl==='warn'?'<i class="flag"></i>':'';
    const hosted=!!hostedInfo(x);
    const icon=L.divIcon({className:'',html:`<div class="pin${lvl==='bad'?' dim':''}${hosted?' hosted':''}" style="--c:${colorVar}">${face(c)}${flag}</div>`,iconSize:[30,30],iconAnchor:[15,15],popupAnchor:[0,-14]});
    const name=x.t.name||c.name;
    const m=L.marker(x.ll,{icon,title:name}).bindPopup(()=>popupHtml(x),{maxWidth:290}).addTo(layer);
    state.markers.set(x.key,m);
    if(i<150){
      const hi=hostedInfo(x), hiLine=hi?`<small class="hf">${esc(hi.short)}</small>`:'';
      const hl=x.hours?`<small class="h ${x.hours.state}">${esc(x.hours.text)}</small>`:'';
      const sub=hiLine+hl+(x.trust?`<small class="t ${x.trust.level}">${esc(x.trust.text)}</small>`:(hl?'':`<small>${esc(details(x)[0]||c.name)}</small>`));
      const li=document.createElement('li');
      li.innerHTML=`<button class="item${lvl==='bad'?' bad':''}${x.hours?.state==='closed'?' shut':''}" style="--c:${colorVar}"><div class="mini">${face(c)}</div><div><b>${esc(name)}</b>${sub}</div><div class="dist">${fmt(x.d)}</div></button>`;
      li.firstChild.onclick=()=>{map.setView(x.ll,Math.max(map.getZoom(),17));m.openPopup();};
      list.appendChild(li);
    }
  });

  if(!CATS.some(c=>c.on)){list.innerHTML='<li class="empty">Pick at least one thing to look for.</li>';setStatus('');return;}
  if(!shown.length){
    list.innerHTML=`<li class="empty">Nothing found within ${fmt(state.radius)}. Try a bigger radius, turn on more categories${state.needs.size?', switch off some access needs':''}, or move the map and tap “Search this area”.</li>`;
    setStatus('');
  } else {
    const counts=CATS.filter(c=>c.on).map(c=>{const n=shown.filter(r=>r.cat===c).length;return n?`${n} ${c.label.toLowerCase()}`:null;}).filter(Boolean);
    const probs=shown.filter(r=>r.trust&&(r.trust.level==='warn'||r.trust.level==='bad')).length;
    setStatus(`${counts.join(', ')} within ${fmt(state.radius)}`+(closedHidden?` – ${closedHidden} closed now, hidden`:'')+(needsHidden?` – ${needsHidden} without your access needs, hidden`:'')+(probs?` – ${probs} with reported problems`:'')+(state.dataBuilt?` – places updated ${ago(new Date(state.dataBuilt))}`:''));
  }
  if(openKey && state.markers.has(openKey)) state.markers.get(openKey).openPopup();
}

locate(false);
loadHoursLib();
})();
</script>
